name: Winlator Lite

on:
  workflow_dispatch:
    inputs:
      base_apk_url:
        description: "(Opcional) Link direto do APK original. Vazio = baixa o ultimo APK oficial do Winlator no GitHub"
        required: false
        default: ""
      trocar_box64:
        description: "Trocar o Box64 do app pelo mais novo"
        type: boolean
        default: true
      trocar_dxvk:
        description: "Trocar o DXVK do app pelo GPLAsync mais novo (menos travadas)"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      COMP_REPO: nicholasx417/WinNative-Components
    steps:
      - name: Instalar zstd
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zstd

      - name: Baixar o APK base
        env:
          BASE_URL: ${{ inputs.base_apk_url }}
        run: |
          if [ -n "$BASE_URL" ]; then
            curl -L --fail --retry 3 -o base.apk "$BASE_URL"
          else
            mkdir -p base_dl
            gh release download -R brunodev85/winlator -p '*.apk' -D base_dl
            mv "$(ls base_dl/*.apk | head -n 1)" base.apk
          fi
          ls -la base.apk

      - name: Chave de assinatura fixa (opcional)
        env:
          SIGN_KEY_PEM: ${{ secrets.SIGN_KEY_PEM }}
          SIGN_CERT_PEM: ${{ secrets.SIGN_CERT_PEM }}
        run: |
          mkdir -p keys
          if [ -n "$SIGN_KEY_PEM" ] && [ -n "$SIGN_CERT_PEM" ]; then
            printf '%s\n' "$SIGN_KEY_PEM" > keys/key.pem
            printf '%s\n' "$SIGN_CERT_PEM" > keys/cert.pem
            echo "Usando chave fixa dos secrets."
          fi

      - name: Baixar Box64 e DXVK novos
        env:
          TROCAR_BOX64: ${{ inputs.trocar_box64 }}
          TROCAR_DXVK: ${{ inputs.trocar_dxvk }}
        run: |
          mkdir -p comp
          latest_tag() {
            gh release list -R "$COMP_REPO" --limit 300 --json tagName -q "[.[].tagName | select(startswith(\"$1\"))][0]"
          }
          fetch() {  # $1=prefixo da tag  $2=pasta destino
            TAG=$(latest_tag "$1")
            echo "$1 -> $TAG"
            mkdir -p "$2"
            if [ -n "$TAG" ] && [ "$TAG" != "null" ]; then
              gh release download "$TAG" -R "$COMP_REPO" -p '*.wcp' -D "$2" || echo "AVISO: falhou o download de $1"
            else
              echo "AVISO: nenhuma versao encontrada para $1"
            fi
          }
          [ "$TROCAR_BOX64" = "true" ] && fetch "box64-nightly-" comp/box64
          [ "$TROCAR_DXVK" = "true" ] && fetch "dxvk-nightly-" comp/dxvk
          ls -laR comp || true

      - name: Gerar o APK leve
        run: |
          cat > patch.py <<'PYEOF'
          #!/usr/bin/env python3
          # Uso: python3 patch.py base.apk saida.apk [--box64 arq.wcp] [--dxvk arq.wcp]
          import zipfile, hashlib, base64, subprocess, json, re, os, sys, struct, zlib, shutil, tempfile, argparse

          ap = argparse.ArgumentParser()
          ap.add_argument('src'); ap.add_argument('out')
          ap.add_argument('--box64'); ap.add_argument('--dxvk')
          A = ap.parse_args()
          SRC, OUT = A.src, A.out
          def warn(m): print('AVISO:', m, flush=True)

          REMOVE = {
           'assets/dxwrapper/d7vk-1.11.tzst', 'assets/dxwrapper/d8vk-1.0.tzst',
           'assets/dxwrapper/dxvk-1.10.3.tzst', 'assets/graphics_driver/zink-22.2.5.tzst',
           'assets/graphics_driver/virgl-23.1.9.tzst', 'lib/arm64-v8a/libvirglrenderer.so',
           'assets/wincomponents/vcrun2005.tzst', 'assets/wincomponents/directplay.tzst',
          }
          NEWDEF = {'BOX64_DYNAREC_SAFEFLAGS': '1', 'BOX64_DYNAREC_BIGBLOCK': '2',
                    'BOX64_DYNAREC_FORWARD': '1024', 'BOX64_DYNAREC_WEAKBARRIER': '1'}

          def fix_env(data):
              try:
                  txt = data.decode('utf-8')
                  for k, v in NEWDEF.items():
                      txt = re.sub(r'(\{"name" : "%s".*?"defaultValue" : ")[^"]*(")' % k, r'\g<1>%s\g<2>' % v, txt)
                  json.loads(txt); return txt.encode('utf-8')
              except Exception as e:
                  warn('env_vars.json nao alterado (%s)' % e); return data

          def fix_dex(d):  # resolucao padrao 1280x720 -> 1280x576 (mesmo tamanho; ordem das strings preservada)
              pat = b'\x081280x720\x00'
              if d.count(pat) != 1:
                  warn('resolucao padrao nao alterada (classes.dex diferente do Winlator 11.2)'); return d
              d = bytearray(d); i = d.index(pat)
              d[i:i+len(pat)] = b'\x081280x576\x00'
              d[12:32] = hashlib.sha1(bytes(d[32:])).digest()
              d[8:12] = (zlib.adler32(bytes(d[12:])) & 0xffffffff).to_bytes(4, 'little')
              return bytes(d)

          def fix_manifest(d):  # debuggable=false
              try:
                  d = bytearray(d); off = 8
                  sp_size = struct.unpack_from('<I', d, off+4)[0]
                  n, ns, flags, sstart, _ = struct.unpack_from('<IIIII', d, off+8)
                  offs = struct.unpack_from('<%dI' % n, d, off+28)
                  def gs(i):
                      p = off+sstart+offs[i]; l = struct.unpack_from('<H', d, p)[0]
                      return d[p+2:p+2+l*2].decode('utf-16le')
                  p = off+sp_size; done = False
                  while p < len(d):
                      t, hs, sz = struct.unpack_from('<HHI', d, p)
                      if t == 0x0102:
                          _, name, astart, asize, acount = struct.unpack_from('<iiHHH', d, p+16)
                          if gs(name) == 'application':
                              ap_ = p+16+astart
                              for k in range(acount):
                                  a = ap_+k*asize
                                  if gs(struct.unpack_from('<i', d, a+4)[0]) == 'debuggable':
                                      struct.pack_into('<i', d, a+16, 0); done = True
                      p += sz
                  if not done: raise ValueError('atributo nao encontrado')
                  return bytes(d)
              except Exception as e:
                  warn('debuggable nao alterado (%s)' % e); return bytes(d) if isinstance(d, bytearray) else d

          # ---------- troca de componentes (.wcp -> .tzst do app) ----------
          def arch_of(path):
              with open(path, 'rb') as f:
                  h = f.read(64)
                  if h[:4] == b'\x7fELF': return 'elf%x' % struct.unpack_from('<H', h, 18)[0]
                  if h[:2] == b'MZ':
                      pe = struct.unpack_from('<I', h, 0x3c)[0]; f.seek(pe)
                      hh = f.read(6)
                      if hh[:4] == b'PE\0\0': return 'pe%x' % struct.unpack_from('<H', hh, 4)[0]
              return 'any'

          def run(cmd, stdout=None, stdin=None):
              subprocess.run(cmd, check=True, stdout=stdout, stdin=stdin)

          def extract_wcp(wcp, dest):
              os.makedirs(dest, exist_ok=True)
              for cmd in (['tar', '-xf', wcp, '-C', dest], ['tar', '--zstd', '-xf', wcp, '-C', dest]):
                  try: run(cmd); return
                  except Exception: pass
              raise RuntimeError('nao consegui abrir o .wcp')

          def swap_component(data, wcp, kind):
              tmp = tempfile.mkdtemp()
              try:
                  with open(tmp+'/o.tzst', 'wb') as f: f.write(data)
                  with open(tmp+'/o.tar', 'wb') as f: run(['zstd', '-d', '-c', '-q', tmp+'/o.tzst'], stdout=f)
                  os.makedirs(tmp+'/A'); run(['tar', '-xf', tmp+'/o.tar', '-C', tmp+'/A'])
                  lst = subprocess.run(['tar', '-tf', tmp+'/o.tar'], check=True, capture_output=True, text=True).stdout
                  open(tmp+'/list.txt', 'w').write(lst)
                  extract_wcp(wcp, tmp+'/B')
                  cand = {}
                  for r, _, fs in os.walk(tmp+'/B'):
                      for fn in fs:
                          p = os.path.join(r, fn); cand.setdefault((fn, arch_of(p)), p)
                  replaced, missing = 0, []
                  for r, _, fs in os.walk(tmp+'/A'):
                      for fn in fs:
                          p = os.path.join(r, fn); key = (fn, arch_of(p))
                          if key in cand: shutil.copyfile(cand[key], p); replaced += 1
                          else: missing.append(fn)
                  if kind == 'box64':
                      ok = replaced == 1 and not missing and arch_of(os.path.join(tmp, 'A/usr/local/bin/box64')) == 'elfb7'
                  else:
                      ok = replaced > 0 and not missing
                  if not ok: raise RuntimeError('estrutura do .wcp nao bate com a do app (trocados=%d, sem par=%s)' % (replaced, missing))
                  run(['tar', '--owner=0', '--group=0', '--numeric-owner', '--no-recursion', '-cf', tmp+'/n.tar', '-C', tmp+'/A', '-T', tmp+'/list.txt'])
                  with open(tmp+'/n.tzst', 'wb') as f: run(['zstd', '-19', '-T0', '-q', '-c', tmp+'/n.tar'], stdout=f)
                  return open(tmp+'/n.tzst', 'rb').read()
              finally:
                  shutil.rmtree(tmp, ignore_errors=True)

          def vkey(n):
              return tuple(int(x) for x in re.findall(r'\d+', n.rsplit('/', 1)[-1])) or (0,)

          zin = zipfile.ZipFile(SRC)
          names = [zi.filename for zi in zin.infolist()]
          slot = {}
          box = sorted([n for n in names if re.fullmatch(r'assets/box64/box64-[\d.]+\.tzst', n)], key=vkey)
          dxv = sorted([n for n in names if re.fullmatch(r'assets/dxwrapper/dxvk-[\d.]+\.tzst', n) and n not in REMOVE], key=vkey)
          if A.box64 and box: slot[box[-1]] = (A.box64, 'box64')
          elif A.box64: warn('slot do Box64 nao encontrado no APK')
          if A.dxvk and dxv: slot[dxv[-1]] = (A.dxvk, 'dxvk')
          elif A.dxvk: warn('slot do DXVK nao encontrado no APK')

          entries = []
          for zi in zin.infolist():
              n = zi.filename
              if n in REMOVE or n.endswith('/'): continue
              if n.startswith('META-INF/') and re.search(r'\.(SF|RSA|DSA|EC)$|MANIFEST\.MF$', n): continue
              data = zin.read(n)
              if n == 'assets/box64/env_vars.json': data = fix_env(data)
              if n == 'classes.dex': data = fix_dex(data)
              if n == 'AndroidManifest.xml': data = fix_manifest(data)
              if n in slot:
                  wcp, kind = slot[n]
                  try:
                      new = swap_component(data, wcp, kind)
                      print('OK: %s trocado por %s (%.1f MB -> %.1f MB)' % (n, os.path.basename(wcp), len(data)/1e6, len(new)/1e6))
                      data = new
                  except Exception as e:
                      warn('%s mantido como original: %s' % (n, e))
              entries.append((n, data, zi.compress_type))

          # ---------- assinatura v1 ----------
          def wrap(line):
              b = line.encode(); out = []; first = True
              while len(b) > (72 if first else 71):
                  k = 72 if first else 71
                  out.append(b[:k]); b = b[k:]; first = False
              out.append(b)
              return b'\r\n '.join(out) + b'\r\n'
          def b64sha(b): return base64.b64encode(hashlib.sha256(b).digest()).decode()

          sections = [wrap('Name: '+n) + wrap('SHA-256-Digest: '+b64sha(data)) + b'\r\n' for n, data, _ in entries]
          mf = b'Manifest-Version: 1.0\r\nCreated-By: 1.0 (Android)\r\n\r\n' + b''.join(sections)
          sf = b'Signature-Version: 1.0\r\nCreated-By: 1.0 (Android)\r\n' + wrap('SHA-256-Digest-Manifest: '+b64sha(mf)) + b'\r\n'
          for (n, _, _), sec in zip(entries, sections):
              sf += wrap('Name: '+n) + wrap('SHA-256-Digest: '+b64sha(sec)) + b'\r\n'

          os.makedirs('keys', exist_ok=True)
          if not (os.path.exists('keys/key.pem') and os.path.exists('keys/cert.pem')):
              warn('sem chave fixa; gerando chave nova (cada build exigira desinstalar a versao anterior).')
              subprocess.run(['openssl', 'req', '-x509', '-newkey', 'rsa:2048', '-nodes', '-keyout', 'keys/key.pem',
                              '-out', 'keys/cert.pem', '-days', '10000', '-subj', '/CN=WinlatorLite'], check=True, capture_output=True)
          open('keys/CERT.SF', 'wb').write(sf)
          rsa = subprocess.run(['openssl', 'smime', '-sign', '-binary', '-noattr', '-outform', 'DER', '-in', 'keys/CERT.SF',
                                '-signer', 'keys/cert.pem', '-inkey', 'keys/key.pem', '-md', 'sha256'],
                               check=True, capture_output=True).stdout

          if os.path.exists(OUT): os.remove(OUT)
          with zipfile.ZipFile(OUT, 'w') as zo:
              def put(n, data, ct):
                  zi = zipfile.ZipInfo(n, (2026, 11, 2, 0, 0, 0)); zi.compress_type = ct; zi.external_attr = 0o644 << 16
                  zo.writestr(zi, data)
              put('META-INF/MANIFEST.MF', mf, zipfile.ZIP_DEFLATED)
              put('META-INF/CERT.SF', sf, zipfile.ZIP_DEFLATED)
              put('META-INF/CERT.RSA', rsa, zipfile.ZIP_DEFLATED)
              for n, data, ct in entries: put(n, data, ct)
          print('pronto: %.1f MB -> %.1f MB' % (os.path.getsize(SRC)/1e6, os.path.getsize(OUT)/1e6))
          PYEOF
          ARGS=""
          B=$(ls comp/box64/*.wcp 2>/dev/null | head -n 1 || true)
          D=$(ls comp/dxvk/*.wcp 2>/dev/null | head -n 1 || true)
          [ -n "$B" ] && ARGS="$ARGS --box64 $B"
          [ -n "$D" ] && ARGS="$ARGS --dxvk $D"
          echo "Argumentos: $ARGS"
          python3 patch.py base.apk Winlator_lite.apk $ARGS

      - name: Publicar Release
        run: |
          gh release create "winlator-lite-${{ github.run_number }}" Winlator_lite.apk \
            --title "Winlator Lite #${{ github.run_number }}" \
            --notes "APK leve e otimizado. Desinstale o Winlator anterior antes de instalar (assinatura diferente)."
